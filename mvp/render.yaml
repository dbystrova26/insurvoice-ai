services:
  - type: web
    name: insurvoice-ai
    runtime: python
    rootDir: mvp
    buildCommand: pip install -r requirements.txt && python download_data.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false           # set manually — used for Whisper STT
      - key: ELEVENLABS_API_KEY
        sync: false           # set manually — used for TTS
      - key: PYTHON_VERSION
        value: "3.11.0"
    plan: free                # sleeps after 15 min; first load ~30s
