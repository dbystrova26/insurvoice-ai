<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsurVoice AI — Avatar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root {
    --void:#0B0614;--deep:#1A0F2E;--violet:#6D4AFF;--vbright:#8B6FFF;
    --lilac:#C7B8FF;--mist:#E8E3F5;--muted:#9488B0;--line:rgba(199,184,255,0.14);
    --panel:rgba(255,255,255,0.03);--success:#4ADE80;--warn:#FFB951;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--void);
    color:var(--mist);min-height:100vh;overflow-x:hidden}

  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .lens{position:absolute;border-radius:50%;border:1px solid var(--line)}
  .l1{width:680px;height:680px;top:-200px;right:-160px;
    background:radial-gradient(circle at 30% 30%,rgba(109,74,255,.16),transparent 60%)}
  .l2{width:480px;height:480px;bottom:-220px;left:-120px;
    background:radial-gradient(circle at 60% 40%,rgba(109,74,255,.12),transparent 60%)}

  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:24px}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;position:relative;flex-shrink:0}
  .mark span{position:absolute;border-radius:50%;border:2px solid var(--violet);top:0;left:0;width:34px;height:34px}
  .mark span:nth-child(2){transform:translateX(7px) scale(.82);border-color:var(--vbright);opacity:.7}
  .mark span:nth-child(3){transform:translateX(14px) scale(.64);border-color:var(--lilac);opacity:.5}
  .brand-name{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .brand-name b{color:var(--vbright)}
  .status-pill{display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.live{background:var(--success);box-shadow:0 0 8px var(--success)}
  .dot.hearing{background:var(--vbright);box-shadow:0 0 8px var(--vbright);animation:pdot 1s infinite}
  .dot.speaking{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  @keyframes pdot{0%,100%{opacity:1}50%{opacity:.4}}

  /* Main layout: avatar left, conversation right */
  .main{display:grid;grid-template-columns:400px 1fr;gap:28px;align-items:start}

  /* Avatar panel */
  .avatar-panel{display:flex;flex-direction:column;align-items:center;gap:16px}
  .avatar-frame{
    width:380px;height:380px;border-radius:24px;overflow:hidden;
    background:var(--deep);border:1px solid var(--line);position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  #avatarVideo{width:100%;height:100%;object-fit:cover;border-radius:24px}
  #avatarAudio{display:none}
  .avatar-placeholder{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
  .avatar-placeholder svg{width:64px;height:64px;fill:var(--muted);opacity:.4}

  /* Mic button below avatar */
  .mic-row{display:flex;align-items:center;gap:14px}
  .mic-btn{
    width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
    background:var(--violet);display:flex;align-items:center;justify-content:center;
    transition:transform .2s,background .3s;
    box-shadow:0 4px 20px rgba(109,74,255,.4);
  }
  .mic-btn:hover{transform:scale(1.06)}
  .mic-btn svg{width:28px;height:28px;fill:#fff}
  .mic-btn.hearing{background:#4ADE80;animation:pulse 1.2s infinite}
  .mic-btn.speaking{background:var(--warn)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}
    70%{box-shadow:0 0 0 22px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
  .mic-label{font-size:13px;font-weight:600;color:var(--mist)}

  /* Hearing bar */
  .hearing-bar{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.2);
    border-radius:8px;padding:8px 14px;font-size:13px;color:#4ADE80;
    width:380px;display:none;text-align:center}
  .hearing-bar.active{display:block}

  /* Conversation panel */
  .convo-panel{display:flex;flex-direction:column;gap:12px}
  .convo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .convo-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .reset-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
    font-family:inherit;font-size:12px;padding:5px 12px;border-radius:7px;cursor:pointer;transition:all .2s}
  .reset-btn:hover{border-color:var(--violet);color:var(--mist)}

  .convo{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;
    padding-right:4px}
  .convo::-webkit-scrollbar{width:4px}
  .convo::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  .msg{max-width:90%;padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.55;animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:var(--violet);color:#fff;border-bottom-right-radius:3px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.bot .tag{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--vbright);font-weight:700;margin-bottom:4px}
  .msg.escalation{align-self:stretch;max-width:100%;background:rgba(255,185,81,.07);border:1px solid rgba(255,185,81,.3);color:var(--warn);font-size:12px}

  .trace{background:rgba(109,74,255,.04);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .trace-title{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--vbright);font-weight:700;margin-bottom:5px}
  .trace-step{font-size:11px;padding:2px 0;color:var(--muted)}
  .trace-step .ag{color:var(--lilac);font-weight:700}
  .trace-step .act{color:var(--vbright);font-weight:600;margin-left:6px}

  .thinking{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;padding:4px 0}
  .blip{width:5px;height:5px;border-radius:50%;background:var(--vbright);animation:blink 1.2s infinite}
  .blip:nth-child(2){animation-delay:.2s}.blip:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* Text input */
  .text-row{display:flex;gap:8px;margin-top:8px}
  .text-row input{flex:1;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:10px 14px;color:var(--mist);font-family:inherit;
    font-size:13px;outline:none;transition:border .2s}
  .text-row input:focus{border-color:var(--violet)}
  .send-btn{background:var(--violet);border:none;color:#fff;font-family:inherit;
    font-weight:600;padding:0 18px;border-radius:9px;cursor:pointer;transition:background .2s}
  .send-btn:hover{background:var(--vbright)}

  /* Compliance pills */
  .pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:4px 11px;font-size:10px;color:var(--muted)}
  .pill b{color:var(--lilac)}

  .err{color:#FF6B8A;font-size:13px;padding:6px;display:none;text-align:center}
  .err.show{display:block}

  @media(max-width:700px){
    .main{grid-template-columns:1fr}
    .avatar-frame{width:100%;height:280px}
    .hearing-bar{width:100%}
  }
</style>
</head>
<body>
<div class="ambient"><div class="lens l1"></div><div class="lens l2"></div></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"><span></span><span></span><span></span></div>
      <div class="brand-name">Insur<b>Voice</b> AI</div>
    </div>
    <div class="status-pill">
      <span class="dot" id="dot"></span>
      <span id="statusTxt">Connecting…</span>
    </div>
  </header>

  <div class="main">
    <!-- LEFT: Avatar -->
    <div class="avatar-panel">
      <div class="avatar-frame">
        <video id="avatarVideo" autoplay playsinline></video>
        <audio id="avatarAudio" autoplay></audio>
        <div class="avatar-placeholder" id="avatarPlaceholder">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
          <span id="avatarStatus">Tap mic to start</span>
        </div>
      </div>

      <div class="mic-row">
        <button class="mic-btn" id="micBtn" onclick="if(window.toggleLive)window.toggleLive()" aria-label="Microphone">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
        </button>
        <div class="mic-label" id="micLabel">Tap to speak</div>
      </div>

      <div class="hearing-bar" id="hearingBar">🎤 <span id="partialTxt"></span></div>
      <div id="errBox" class="err"></div>
    </div>

    <!-- RIGHT: Conversation -->
    <div class="convo-panel">
      <div class="convo-head">
        <div class="convo-title">Conversation</div>
        <button class="reset-btn" onclick="if(window.resetCall)window.resetCall()">Reset</button>
      </div>
      <div id="convo" class="convo"></div>
      <div class="text-row">
        <input id="textIn" placeholder="Or type…" onkeypress="if(event.key==='Enter')window.sendText()">
        <button class="send-btn" onclick="window.sendText()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Globals ────────────────────────────────────────────────────────────

  let socket = null;
  let isLive = false;
  let isSpeaking = false;
  let deepgramAvailable = false;
  let mediaStream = null;
  let audioCtx = null;
  let processor = null;
  const WORKLET = `
    registerProcessor('pcm-processor', class extends AudioWorkletProcessor {
      process(inputs) {
        const input = inputs[0][0];
        const buf = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          buf[i] = Math.min(1, input[i]) < 0 ? input[i] * 0x8000 : input[i] * 0x7FFF;
        }
        this.port.postMessage(buf);
        return true;
      }
    });
  `;

  // Simli (avatar)
  let simliClient = null;
  const SIMLI_API_KEY = '{{ simli_api_key }}';
  const SIMLI_FACE_ID = '{{ simli_face_id }}';

  // ── Simli Initialization ───────────────────────────────────────────────

  async function initializeSimli() {
    const videoEl = document.getElementById('avatarVideo');
    const placeholderEl = document.getElementById('avatarPlaceholder');

    try {
      console.log('[Simli] Getting credentials from backend...');
      
      // Get Simli credentials from backend
      const sessResp = await fetch('/api/simli/session');
      const sessData = await sessResp.json();
      
      if (!sessResp.ok || !sessData.apiKey || !sessData.faceId) {
        console.warn('⚠️  Simli credentials not available (avatar disabled)');
        placeholderEl.innerHTML = '<div style="text-align:center;color:var(--muted)">Avatar unavailable<br><small>Simli not configured</small></div>';
        return false;
      }

      const { session_token } = sessData;

      console.log('[Simli] Got session token, creating WebRTC connection...');
      
      // Create RTCPeerConnection
      const pcConfig = {
        iceServers: [
          { urls: ["stun:stun.l.google.com:19302"] },
          { urls: ["stun:stun1.l.google.com:19302"] },
          { urls: ["stun:stun2.l.google.com:19302"] },
          { urls: ["stun:stun3.l.google.com:19302"] },
          { urls: ["stun:stun4.l.google.com:19302"] }
        ]
      };

      const pc = new RTCPeerConnection(pcConfig);

      // Handle remote video stream
      pc.ontrack = (event) => {
        console.log('✅ Simli video stream received');
        if (videoEl) {
          videoEl.srcObject = event.streams[0];
          placeholderEl.style.display = 'none';
          videoEl.style.display = 'block';
        }
      };

      pc.onconnectionstatechange = () => {
        console.log(`[Simli] Connection state: ${pc.connectionState}`);
        if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          console.error('❌ Simli connection lost');
          videoEl.style.display = 'none';
          placeholderEl.style.display = 'flex';
        }
      };

      pc.oniceconnectionstatechange = () => {
        console.log(`[Simli] ICE connection state: ${pc.iceConnectionState}`);
      };
      
      pc.onicegatheringstatechange = () => {
        console.log(`[Simli] ICE gathering state: ${pc.iceGatheringState}`);
      };

      console.log('[Simli] Creating offer...');
      
      // Create offer
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      console.log('[Simli] Sending to Simli API...');

      // Send offer to Simli with session token
      const answerResp = await fetch('https://api.simli.ai/startAudioToVideoSession', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionToken: session_token,
          offer: offer.sdp
        })
      });

      if (!answerResp.ok) {
        const errText = await answerResp.text();
        console.error('[Simli] Answer error:', answerResp.status, errText);
        return false;
      }

      const answerData = await answerResp.json();

      await pc.setRemoteDescription(answer);

      // Store for audio playback
      simliClient = {
        pc: pc,
        videoEl: videoEl,
        placeholderEl: placeholderEl,
        connected: true
      };

      console.log('✅ Simli initialized (waiting for stream…)');
      return true;

    } catch (err) {
      console.error('❌ Simli initialization failed:', err);
      placeholderEl.innerHTML = `<div style="color:var(--warn)">${err.message}</div>`;
      return false;
    }
  }

  // ── Socket.IO ──────────────────────────────────────────────────────────

  function initSocket() {
    socket = io();

    socket.on("connect", () => {
      console.log("✅ Connected to server");
      setStatus('live', 'Live STT ready');
    });

    socket.on("connected", (d) => {
      deepgramAvailable = d.deepgram_available;
      if (d.deepgram_available) {
        setMicState('idle');
      } else {
        showErr('No Deepgram key — use text box only');
      }
    });

    socket.on("partial_transcript", (d) => {
      document.getElementById('partialTxt').textContent = d.text;
      document.getElementById('hearingBar').classList.add('active');
    });

    socket.on("transcript", (d) => {
      document.getElementById('partialTxt').textContent = '';
      addMsg('user', d.text);
      showThinking();
    });

    socket.on('reply', d => {
      hideThinking();
      addMsg('bot', d.reply, d.intent);
      
      if (d.escalated) {
        addMsg('escalation',
          '⚡ Transferring to a colleague.' + (d.handoff_summary ? ' ' + d.handoff_summary : ''));
      }

      // ✅ CRITICAL: Handle audio URL (not base64)
      if (d.audio_url) {
        isSpeaking = true;
        setMicState('speaking');
        setStatus('speaking', 'Speaking…');

        // Play audio from URL
        const audio = new Audio(d.audio_url);
        audio.crossOrigin = 'anonymous';
        
        audio.onplay = () => {
          console.log('🎵 Audio playing');
        };
        
        audio.onerror = (err) => {
          console.error('❌ Audio error:', err);
          // Fallback: skip to next turn
          isSpeaking = false;
        };
        
        audio.onended = () => {
          console.log('✅ Audio ended');
          isSpeaking = false;
          if (isLive && !d.escalated) {
            setMicState('hearing');
            setStatus('hearing', 'Hearing you…');
            if (socket) socket.emit('resume_stream');
          } else {
            setMicState('idle');
            setStatus('live', 'Live STT ready');
          }
        };

        // Play it
        audio.play().catch(err => {
          console.error('Play failed:', err);
          // Resume listening anyway
          isSpeaking = false;
          if (isLive && !d.escalated) {
            socket.emit('resume_stream');
          }
        });

        // Fallback timeout (in case onended doesn't fire)
        setTimeout(() => {
          if (isSpeaking) {
            isSpeaking = false;
            if (isLive && !d.escalated) {
              setMicState('hearing');
              setStatus('hearing', 'Hearing you…');
              if (socket) socket.emit('resume_stream');
            } else {
              setMicState('idle');
              setStatus('live', 'Live STT ready');
            }
          }
        }, 5000);
      }
    });

    socket.on('stream_error', d => showErr(d.error));
    socket.on('disconnect', () => setStatus('offline', 'Offline'));
  }

  // ── Mic control ────────────────────────────────────────────────────────

  window.toggleLive = async function() {
    if (!deepgramAvailable) { showErr('No Deepgram key — use text box.'); return; }
    if (isLive) { stopLive(); return; }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      await audioCtx.resume();
      const source = audioCtx.createMediaStreamSource(mediaStream);
      const blob = new Blob([WORKLET], { type: 'application/javascript' });
      await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
      processor = new AudioWorkletNode(audioCtx, 'pcm-processor');
      processor.port.onmessage = e => {
        if (socket && isLive && !isSpeaking) socket.emit('audio_chunk', e.data);
      };
      source.connect(processor);
      isLive = true;
      socket.emit('start_stream');
      setMicState('hearing');
      document.getElementById('micLabel').textContent = 'Tap to stop';
      setStatus('hearing', 'Hearing you…');
    } catch (e) {
      showErr('Mic error: ' + e.message);
    }
  };

  function stopLive() {
    isLive = false;
    if (processor) { processor.disconnect(); processor = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (socket) socket.emit('stop_stream');
    setMicState('idle');
    document.getElementById('micLabel').textContent = 'Tap to speak';
    document.getElementById('hearingBar').classList.remove('active');
    setStatus('live', 'Live STT ready');
    isSpeaking = false;
  }

  // ── Text input ──────────────────────────────────────────────────────────

  window.sendText = async function() {
    const input = document.getElementById('textIn');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg('user', text);
    showThinking();
    try {
      const r = await fetch('/api/text', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, tts: true })
      });
      const d = await r.json();
      hideThinking();
      if (!r.ok) { showErr(d.error); return; }
      addMsg('bot', d.reply, d.intent);
      if (d.escalated) addMsg('escalation', '⚡ Transferring to a colleague.');
      
      // ✅ Handle audio URL
      if (d.audio_url) {
        const audio = new Audio(d.audio_url);
        audio.play().catch(() => {});
      }
    } catch (e) { hideThinking(); showErr('Error: ' + e.message); }
  };

  // ── UI helpers ──────────────────────────────────────────────────────────

  function addMsg(role, text, intent) {
    const c = document.getElementById('convo');
    const d = document.createElement('div');
    if (role === 'escalation') {
      d.className = 'msg escalation';
      d.innerHTML = text;
    } else if (role === 'user') {
      d.className = 'msg user'; d.textContent = text;
    } else {
      d.className = 'msg bot';
      d.innerHTML = (intent ? `<span class="tag">InsurVoice · ${esc(intent)}</span>` : '') + esc(text);
    }
    c.appendChild(d);
    d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function showThinking() {
    const c = document.getElementById('convo');
    const d = document.createElement('div');
    d.className = 'thinking'; d.id = 'thinking';
    d.innerHTML = 'Thinking <span class="blip"></span><span class="blip"></span><span class="blip"></span>';
    c.appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  function hideThinking() { const t = document.getElementById('thinking'); if(t) t.remove(); }

  function setMicState(s) {
    document.getElementById('micBtn').className = 'mic-btn' +
      (s==='hearing'?' hearing':s==='speaking'?' speaking':'');
  }
  function setStatus(s, txt) {
    document.getElementById('dot').className = 'dot' +
      (s==='live'?' live':s==='hearing'?' hearing':s==='speaking'?' speaking':'');
    document.getElementById('statusTxt').textContent = txt;
  }
  function showErr(msg) {
    const b = document.getElementById('errBox');
    b.textContent = msg; b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 7000);
  }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  window.resetCall = async function() {
    stopLive();
    await fetch('/api/reset', { method: 'POST' });
    document.getElementById('convo').innerHTML = '';
    document.getElementById('hearingBar').classList.remove('active');
  };

  // ── Boot ────────────────────────────────────────────────────────────────

  document.addEventListener('DOMContentLoaded', async () => {
    // Initialize Simli avatar
    await initializeSimli();
    
    // Check health
    fetch('/api/health').then(r => r.json()).then(d => {
      if (!d.anthropic) showErr('Missing ANTHROPIC_API_KEY');
    }).catch(() => {});

    // Initialize Socket.IO
    initSocket();
  });
</script>
</body>
</html>
