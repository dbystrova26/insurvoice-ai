<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsurVoice AI - Avatar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1200px;
            width: 90%;
            padding: 2rem;
        }
        .avatar-section { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .avatar-frame {
            width: 100%;
            aspect-ratio: 9/16;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #avatarVideo { width: 100%; height: 100%; object-fit: cover; display: none; }
        #avatarPlaceholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            padding: 0.75rem 1.5rem;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 8px;
            color: #4caf50;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .conversation-section { display: flex; flex-direction: column; gap: 1rem; height: 100%; }
        .messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            word-wrap: break-word;
        }
        .message.bot { background: rgba(100, 150, 255, 0.2); border-left: 3px solid #6496ff; align-self: flex-start; max-width: 80%; }
        .message.user { background: rgba(76, 175, 80, 0.2); border-left: 3px solid #4caf50; align-self: flex-end; max-width: 80%; }
        .input-section { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
        input, button {
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
        }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; cursor: pointer; font-weight: 600; }
        .logo { position: absolute; top: 1rem; left: 1rem; font-size: 1.5rem; font-weight: bold; }
        .logo span { color: #667eea; }
    </style>
</head>
<body>
    <div class="logo"><span>InsurVoice</span> AI</div>
    <div class="container">
        <div class="avatar-section">
            <div class="avatar-frame">
                <video id="avatarVideo" autoplay playsinline muted></video>
                <div id="avatarPlaceholder">
                    <div style="font-size: 4rem;">👤</div>
                    <div>Avatar Loading...</div>
                </div>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span>Live STT ready</span>
            </div>
        </div>
        <div class="conversation-section">
            <h2>Conversation</h2>
            <div class="messages" id="messages">
                <div class="message bot">Hello, you're speaking with InsurVoice, an AI assistant for Allianz Direct. How can I help you today?</div>
            </div>
            <div class="input-section">
                <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/simli-client@latest/dist/simli-client.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const SIMLI_API_KEY = '{{ simli_api_key }}';
        const SIMLI_FACE_ID = '{{ simli_face_id }}';
        let socket = null;
        let simliClient = null;

        async function initializeSimli() {
            const videoEl = document.getElementById('avatarVideo');
            const placeholderEl = document.getElementById('avatarPlaceholder');
            try {
                console.log('[Simli] Getting session token...');
                const configResp = await fetch('/api/simli/session');
                const config = await configResp.json();
                if (!configResp.ok || !config.session_token) {
                    console.warn('⚠️  Simli not available');
                    return false;
                }
                const sessionToken = config.session_token;
                console.log('[Simli] Creating client...');
                simliClient = new window.SimliClient(
                    sessionToken,
                    videoEl,
                    null,
                    [{ urls: ['stun:stun.l.google.com:19302'] }],
                    'DEBUG'
                );
                console.log('[Simli] Connecting...');
                await simliClient.start();
                console.log('✅ Simli initialized');
                placeholderEl.style.display = 'none';
                videoEl.style.display = 'block';
                return true;
            } catch (err) {
                console.error('❌ Simli failed:', err.message);
                return false;
            }
        }

        function initSocket() {
            socket = io();
            socket.on('connect', () => {
                console.log('✅ Connected to server');
            });
            socket.on('reply', (data) => {
                if (data.reply) {
                    document.getElementById('messages').innerHTML += `<div class="message bot">${data.reply}</div>`;
                    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                }
            });
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            document.getElementById('messages').innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            if (socket) socket.emit('user_input', { text: text });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initializeSimli();
            initSocket();
        });
    </script>
</body>
</html>
