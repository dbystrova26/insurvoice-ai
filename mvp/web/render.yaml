services:
  - type: web
    name: insurvoice-ai
    runtime: python
    rootDir: mvp/web
    buildCommand: pip install -r requirements.txt && python download_data.py
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false           # Whisper speech-to-text
      - key: ELEVENLABS_API_KEY
        sync: false           # text-to-speech voice
      - key: FLASK_SECRET
        generateValue: true   # Render generates a random secret
      - key: PYTHON_VERSION
        value: "3.11.0"
    plan: free                # sleeps after 15 min; first load ~30s
